<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapids!/Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="White Water Rafting Site Contact us page for Justin Kilpack's WDD 130 Project">
    <meta name="author" content="Justin Kilpack">
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="title">
            <h1>Rapids!</h1>
        </div>
        <section class="contact">
            <div class="contact">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>
        </section>

        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d70058.17569320904!2d-90.68383020161188!3d39.102754588668674!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1775348306373!5m2!1sen!2sus"
              width="400" height="420" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <section>
            <form>


                <label for="Name">Name</label>
                <input type="text" id="Name" name="Name" class="name">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="email">

                <div class="purpose">
                    <label for="purpose">Message Purpose</label>

                </div>

                <input type="radio" id="Purpose" name="Purpose">
                <label for="Purpose">General Inquiry</label>

                <input type="radio" id="Purpose" name="Purpose">
                <label for="Purpose">Reservation Question</label>

                <input type="radio" id="Purpose" name="Purpose">
                <label for="Purpose">Website Suggestion</label>


                <div class="message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>

                </div>

                <input type="checkbox" name="checkbox" id="checkbox">
                <label for="checkbox" class="checkbox">Please subscribe me to the monthly
                    newsletter</label>

                <button type="submit">Get in touch!</button>
            </form>
        </section>
        <section>
            <h2>We are here to serve you!</h2>
            <div Class="flex">
                <figure>
                    <img src="images/man1.webp" alt="group">
                    <figcaption>Cameron - Founder</figcaption>
                </figure>
                <figure>
                    <img src="images/man2.webp" alt="oars">
                    <figcaption>Jacob - Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/woman.webp" alt="rafting">
                    <figcaption>Sara - Customer Experience specialist</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <nav class="socialmedia">
            <a href="https://www.facebook.com"><img src="images/facebook.svg" alt="Facebook Logo"
                  width="100"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.svg" alt="Instagram Logo"
                  width="100"></a>
            <a href="https://www.x.com"><img src="images/xlogo.svg" alt="X Logo" width="100"></a>
        </nav>
        <p>©️2026 💦Rapids💦 Justin Kilpack</p>
    </footer>
</body>

</html>
