<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapids!/Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="White Water Rafting Site Contact us page for Justin Kilpack's WDD 130 Project">
    <meta name="author" content="Justin Kilpack">
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Rapids!</h2>
            <div class="contact">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>
        </section>
        <section class="flex">
            <form action="">

                <label for="Name">Name</label>
                <input type="text" id="Name" name="Name">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">

                <div class="purpose">
                    <label for="purpose">Message Purpose</label>
                    <input type="radio" id="purpose" name="purpose">
                    <input type="radio" id="GI" name="GI">
                    <label for="Suggestion">Website Suggestion</label>
                    <input type="radio" id="Suggestion" name="Suggestion">
                </div>

                <div>
                    <label for="message">Your Message</label>
                    <textarea name="message" id="message" aria-colspan="2"></textarea>

                </div>
            </form>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d41743.50914536467!2d-90.66523843589025!3d38.95585411365311!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1775339973270!5m2!1sen!2sus"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>


    </main>

    <footer>
        <nav class="socialmedia">
            <a href="https://www.facebook.com"><img src="images/facebook.svg" alt="Facebook Logo"
                  width="100"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.svg" alt="Instagram Logo"
                  width="100"></a>
            <a href="https://www.x.com"><img src="images/xlogo.svg" alt="X Logo" width="100"></a>
        </nav>
        <p>©️2026 💦Rapids💦 Justin Kilpack</p>
    </footer>
</body>

</html>
